<header><div><p>Windows 11 Fluent Design · 首轮设计稿 · 2026-11-03</p><h1>New7z，文件的收与放。</h1><p>围绕文件浏览、压缩与解压设计。点击任意图片查看完整分辨率。</p></div><a class="start" href="../prototype/index.html">体验交互原型 →</a></header>
<div class="grid">
<figure><a href="screenshots/11-图片预览.png"><img src="screenshots/11-图片预览.png" alt="压缩包内图片预览，支持缩放、适应窗口和前后切换"></a><figcaption><strong>图片预览 · 新增</strong><p>按需查看所选图片，适应窗口或以原始尺寸滚动阅读。</p></figcaption></figure>
<figure><a href="screenshots/12-文本预览.png"><img src="screenshots/12-文本预览.png" alt="压缩包内只读文本预览，支持行号、查找和自动换行"></a><figcaption><strong>文本预览 · 新增</strong><p>行号、查找、自动换行与编码选择，内容以纯文本安全显示。</p></figcaption></figure>
<figure><a href="screenshots/13-文本预览-深色.png"><img src="screenshots/13-文本预览-深色.png" alt="深色主题下的文本预览"></a><figcaption><strong>文本预览 · 深色</strong><p>复用窗口与控件规范，保持只读内容清晰。</p></figcaption></figure>
<figure><a href="screenshots/01-主页.png"><img src="screenshots/01-主页.png" alt="主页：打开压缩包、创建压缩包与最近使用列表"></a><figcaption><strong>主页</strong><p>两个核心任务入口，拖放区域与最近记录。</p></figcaption></figure>
<figure><a href="screenshots/02-压缩包浏览.png"><img src="screenshots/02-压缩包浏览.png" alt="压缩包浏览：命令栏、面包屑、文件表格与属性面板"></a><figcaption><strong>压缩包浏览</strong><p>熟悉的文件工作区，体积对照直观呈现归档效果。</p></figcaption></figure>
<figure><a href="screenshots/03-新建压缩.png"><img src="screenshots/03-新建压缩.png" alt="新建压缩包对话框"></a><figcaption><strong>新建压缩</strong><p>格式、级别、密码；高级选项按需展开。</p></figcaption></figure>
<figure><a href="screenshots/04-解压到.png"><img src="screenshots/04-解压到.png" alt="解压目录与冲突策略设置"></a><figcaption><strong>解压到</strong><p>明确输出目录、选中范围与同名文件策略。</p></figcaption></figure>
<figure><a href="screenshots/05-任务中心.png"><img src="screenshots/05-任务中心.png" alt="任务中心：进度、暂停与取消状态"></a><figcaption><strong>任务中心</strong><p>后台任务可追踪，失败配置可修改并重新尝试。</p></figcaption></figure>
<figure><a href="screenshots/08-同名冲突.png"><img src="screenshots/08-同名冲突.png" alt="同名文件冲突对话框"></a><figcaption><strong>同名冲突</strong><p>对比新旧文件，默认保留两者，明确覆盖范围。</p></figcaption></figure>
<figure class="tall"><a href="screenshots/06-外观与图标-浅色.png"><img src="screenshots/06-外观与图标-浅色.png" alt="浅色外观、应用图标替换和现有格式图标预览"></a><figcaption><strong>外观与图标 · 浅色</strong><p>使用工程原始 Logo 与格式图标合集，支持应用内图标替换。</p></figcaption></figure>
<figure class="tall"><a href="screenshots/07-外观与图标-深色.png"><img src="screenshots/07-外观与图标-深色.png" alt="深色外观与图标设置"></a><figcaption><strong>外观与图标 · 深色</strong><p>相同布局与操作，独立的暗色语义层级。</p></figcaption></figure>
<figure><a href="screenshots/09-压缩包浏览-深色.png"><img src="screenshots/09-压缩包浏览-深色.png" alt="深色压缩包文件浏览页面"></a><figcaption><strong>压缩包浏览 · 深色</strong><p>表格、选择、边界和强调色共同适配。</p></figcaption></figure>
<figure><a href="screenshots/10-窄视口.png"><img src="screenshots/10-窄视口.png" alt="窄视口重排检查" style="object-fit:contain;background:#151c2c"></a><figcaption><strong>窄窗口可达性</strong><p>验证布局重排与操作可达；正式产品仍以 Windows 桌面为目标。</p></figcaption></figure>
