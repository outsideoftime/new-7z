<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1440">
<title>New7z 抖音封面</title>
<style>
  :root{--zh:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;--display:"Bahnschrift","Segoe UI Variable Display","Segoe UI",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1440px;overflow:hidden;background:#04060b}
  body{font-family:var(--zh);-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:1080px;height:1440px;overflow:hidden;
    background:
      radial-gradient(900px 760px at 16% 4%,rgba(30,84,230,.34),transparent 62%),
      radial-gradient(760px 640px at 90% 30%,rgba(0,176,255,.16),transparent 66%),
      radial-gradient(1000px 700px at 50% 104%,rgba(24,64,190,.24),transparent 70%),
      linear-gradient(180deg,#04070e,#050810 48%,#03060d)}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(150,190,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(150,190,255,.06) 1px,transparent 1px);
    background-size:90px 90px;
    mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 72%)}
  .grain{position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.42'/></svg>")}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 40%,rgba(0,0,0,.4) 80%,rgba(0,0,0,.78) 100%)}
  .hud{position:absolute;left:72px;right:72px;top:74px;display:flex;align-items:center;gap:16px}
  .hud img{width:40px;height:40px;border-radius:11px;box-shadow:0 0 24px rgba(47,125,255,.6)}
  .hud b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.42em;color:rgba(224,238,255,.85)}
  .hud em{margin-left:auto;font-family:var(--mono);font-size:15px;letter-spacing:.24em;color:rgba(190,214,255,.4);font-style:normal}
  .rule{position:absolute;left:72px;right:72px;top:132px;height:1px;background:rgba(160,200,255,.16)}
  .center{position:absolute;left:72px;right:72px;top:330px;text-align:center}
  .kicker{font-family:var(--display);font-size:21px;letter-spacing:.52em;color:rgba(180,210,255,.6);text-indent:.52em;margin-bottom:44px}
  h1{font-size:92px;font-weight:300;letter-spacing:.02em;color:rgba(240,246,255,.92);line-height:1.24}
  h1 .l1{display:block}
  h1 b{display:block;font-size:122px;font-weight:800;letter-spacing:.01em;line-height:1.18;
    background:linear-gradient(100deg,#ffffff 6%,#d6e9ff 38%,#8fc4ff 62%,#4f9dff 92%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 10px 46px rgba(47,125,255,.38))}
  .mark{position:absolute;left:0;right:0;top:820px;display:flex;align-items:center;justify-content:center;gap:28px}
  .mark img{width:112px;height:112px;border-radius:28px;box-shadow:0 18px 50px rgba(0,40,140,.6),0 0 60px rgba(47,125,255,.4)}
  .mark .name{text-align:left}
  .mark .name span{display:block;font-family:var(--display);font-size:66px;font-weight:700;letter-spacing:.02em;
    background:linear-gradient(180deg,#fff,#c8ddff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mark .name em{display:block;margin-top:6px;font-style:normal;font-size:24px;font-weight:300;letter-spacing:.44em;color:rgba(200,222,255,.66)}
  .tag{position:absolute;left:0;right:0;top:1010px;text-align:center;font-size:34px;font-weight:300;letter-spacing:.14em;color:rgba(226,239,255,.86)}
  .url{position:absolute;left:50%;transform:translateX(-50%);top:1120px;padding:20px 38px;border-radius:100px;
    border:1px solid rgba(160,205,255,.28);background:rgba(120,170,255,.07);
    font-family:var(--display);font-size:24px;letter-spacing:.1em;color:rgba(200,225,255,.85)}
  .foot{position:absolute;left:0;right:0;bottom:74px;text-align:center;font-family:var(--display);font-size:16px;letter-spacing:.34em;color:rgba(160,195,245,.4)}
  [data-lang="en"] h1 .l1{font-size:78px}
  [data-lang="en"] h1 b{font-size:84px}
  [data-lang="en"] .tag{letter-spacing:.06em;font-size:32px}
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="hud"><img src="assets/logo.png" alt=""><b>NEW7Z</b><em>WIN 11 · X64</em></div>
  <div class="rule"></div>
  <div class="center">
    <div class="kicker" id="c-kicker">NEW7Z · 新 7z</div>
    <h1><span class="l1" id="c-l1">一个压缩软件</span><b id="c-l2">能有多讲究？</b></h1>
  </div>
  <div class="mark">
    <img src="assets/logo.png" alt="New7z">
    <div class="name"><span>New7z</span><em>新 7z</em></div>
  </div>
  <div class="tag" id="c-tag">开源免费 · 为 Windows 11 而生</div>
  <div class="url">github.com/outsideoftime/new-7z</div>
  <div class="foot" id="c-foot">WINUI 3 · 完整 7-ZIP 引擎 · MIT</div>
  <div class="grain"></div>
  <div class="vig"></div>
</div>
<script>
  if (new URLSearchParams(location.search).get("lang") === "en") {
    document.documentElement.setAttribute("data-lang", "en");
    document.documentElement.lang = "en";
    document.getElementById("c-kicker").textContent = "NEW7Z · WINDOWS 11";
    document.getElementById("c-l1").textContent = "A file archiver";
    document.getElementById("c-l2").textContent = "can look this good?";
    document.getElementById("c-tag").textContent = "Open source · built for Windows 11";
    document.getElementById("c-foot").textContent = "WINUI 3 · FULL 7-ZIP ENGINE · MIT";
  }
</script>
</body>
</html>
